apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarestproxy
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-kafka-rest:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  podTemplate:
    labels:
      env: local-poc
      service: kafka-restproxy
      component: kafkarestproxy
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # # ad.datadoghq.com/kafkarestproxy.check_names: '["openmetrics"]'
      # # ad.datadoghq.com/kafkarestproxy.init_configs: '[{}]'
      # # ad.datadoghq.com/kafkarestproxy.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[".*"],"timeout":30}]'
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
