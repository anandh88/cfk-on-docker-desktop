# Splunk OTel Collector Helm values for Docker Desktop Kubernetes — Splunk Observability
# Cloud target (SignalFx-lineage product), NOT Splunk Cloud Platform. See
# ../splunk/README-enterprise.md and this directory's README.md for why these are
# different products and what does/doesn't carry over between them.
#
# Installed as its OWN Helm release (splunk-otel-collector-o11y), in its OWN namespace
# (splunk-o11y-otel) — deliberately separate from the existing Splunk Cloud collector
# (release "splunk-otel-collector", namespace "splunk-otel") so the two run side by
# side without colliding, for comparison during this POC.
#
# Deploy:
#   helm upgrade --install splunk-otel-collector-o11y \
#     --namespace splunk-o11y-otel --create-namespace \
#     --values monitoring/splunk-observability/otel-collector-values.docker-desktop.yaml \
#     --set splunkObservability.accessToken=<YOUR_TOKEN> \
#     splunk-otel-collector-chart/splunk-otel-collector
#
# The access token is deliberately NOT set here and NOT committed anywhere — same
# practice as the HEC token on the Splunk Cloud side. Passed via --set at deploy time
# for now; migrating to the secret-based pattern (secret.create: false / secret.name,
# mirroring the Splunk Cloud collector's splunk-hec secret) is a reasonable next step
# once this moves past initial validation, but the exact secret key name for
# splunkObservability's token hasn't been verified yet, so not doing that blind.

clusterName: "docker-desktop"
environment: "local-poc"

splunkObservability:
  realm: "us1"
  # accessToken: set via --set at deploy time, see above.
  # Traces disabled - this POC covers metrics only (and logs, separately, via the
  # existing Splunk Cloud pipeline + Log Observer Connect if that path is taken).
  # Confirmed: this chart bakes in Jaeger/Zipkin hostPort bindings whenever traces
  # are enabled, regardless of whether anything sends traces - those ports collided
  # with the existing Splunk Cloud collector on this single-node cluster the moment
  # they were bound, well before any trace data was ever a factor.
  tracesEnabled: false

gateway:
  enabled: false

agent:
  # Off - not needed (no local app sending OTLP/Jaeger/Zipkin directly to a node
  # IP; that would only matter for zero-code app instrumentation, which is
  # explicitly disabled for this integration). Also: turning this off alone did
  # NOT resolve the port collision below - hostPort bindings on this chart are
  # independent of hostNetwork, see agent.ports.
  hostNetwork: false

  # otlp/otlp-http hostPort bindings (4317/4318) are baked into this chart's agent
  # DaemonSet template unconditionally, independent of hostNetwork above. The
  # existing Splunk Cloud collector's agent DaemonSet already binds those same
  # host ports on this single-node cluster, so the second collector's agent pod
  # sat Pending ("didn't have free ports for the requested pod ports") until these
  # were disabled outright. Confirmed via the chart's own values.yaml comment:
  # "to disable a port set `agent.ports.<name>: null`".
  ports:
    otlp: null
    otlp-http: null

  # Bumped from the chart's 500Mi default -> 1Gi 2026-08-20: adding the
  # prometheus/cfk receiver below OOMKilled the agent (confirmed via
  # `lastState.reason: OOMKilled`, exitCode 137) within a minute of the first
  # scrape. Root cause measured directly: the federated `{namespace="confluent"}`
  # match returns ~107k series / ~48MB per scrape (every CFK component's JMX
  # percentile families and per-topic/per-instance breakouts, plus
  # cAdvisor/kube-state-metrics) - the same cardinality problem already hit and
  # fixed identically on the Splunk Cloud collector
  # (../splunk/otel-collector-values.docker-desktop.yaml), matched here to the
  # same 1Gi ceiling. Narrowing the federate match[] is the real fix if this
  # keeps growing - see that file's comment for the same caveat.
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

  config:
    receivers:
      # Docker Desktop's kubelet presents a self-signed cert with no IP SANs for
      # its own node IP (same class of issue as the Splunk Cloud HEC endpoint's
      # internal CA, just on the receiving side here instead of the exporting
      # side) - without this, kubelet_stats fails every scrape with
      # "x509: cannot validate certificate for <node-ip> because it doesn't
      # contain any IP SANs", meaning no pod/container CPU or memory metrics at
      # all would reach the built-in Kubernetes navigator.
      kubelet_stats:
        insecure_skip_verify: true
      # Same federate pattern as the Splunk Cloud collector's prometheus/cfk
      # receiver (monitoring/splunk/otel-collector-values.docker-desktop.yaml) -
      # scrapes kube-prometheus-stack's Prometheus /federate endpoint, scoped to
      # namespace="confluent", so the same CFK JMX + Kubernetes-resource series
      # land here too. Per Splunk's own docs, metrics arriving via a Prometheus
      # receiver are "custom metrics, not supported by built-in content" - these
      # won't populate the built-in Kubernetes navigator or any other built-in
      # dashboard; they need custom charts (see README.md's open questions).
      prometheus/cfk:
        config:
          scrape_configs:
            - job_name: cfk-metrics
              honor_labels: true
              scrape_interval: 30s
              metrics_path: /federate
              params:
                'match[]': ['{namespace="confluent"}']
              static_configs:
                - targets: ['prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090']
    service:
      pipelines:
        # New pipeline, not added to the existing "metrics" pipeline's receiver
        # list - Helm's --set can't append to an array (it replaces), and a
        # values-file deep-merge on `service.pipelines` (a map) adds this key
        # alongside the existing ones without touching them, same as the Splunk
        # Cloud collector's metrics/cfk pipeline.
        metrics/cfk:
          receivers: [prometheus/cfk]
          processors: [memory_limiter, batch, resource_detection, resource]
          exporters: [signalfx]

# Not fixed and not expected to be, on Docker Desktop: kube-scheduler (:10259),
# kube-proxy (:10249), and kube-controller-manager (:10257) all refuse the
# receiver_creator's scrape attempts - Docker Desktop's single-node control plane
# doesn't expose these the way a real multi-node cluster's would. Matches the same
# call already made on the Splunk Cloud/Grafana side (control-plane metrics
# disabled there too) - not a CFK or Observability Cloud concern either way.
