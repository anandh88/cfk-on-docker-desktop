prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:

# Stamp env/cluster labels onto cAdvisor container metrics (used by the
# *_Resources dashboards) so they can be filtered the same way as the JMX metrics.
# namespace/pod are already native labels on these metrics.
kubelet:
  serviceMonitor:
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: env
        replacement: 'local-poc'
      - action: replace
        targetLabel: cluster
        replacement: 'docker-desktop'

# Stamp env/cluster labels onto kube-state-metrics (container resource limits, PVC
# requests, etc.) used by the *_Resources dashboards.
kube-state-metrics:
  serviceMonitor:
    relabelings:
      - action: replace
        targetLabel: env
        replacement: 'local-poc'
      - action: replace
        targetLabel: cluster
        replacement: 'docker-desktop'

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true

alertmanager:
  enabled: true

# Reduce resource usage for local POC
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true
