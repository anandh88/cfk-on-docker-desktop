apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: confluent-platform-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
  - name: kafka-brokers
    rules:
    # Page when ActiveControllerCount != 1 for more than 10s.
    - alert: ActiveControllerCountNotOne
      expr: sum by (env) (kafka_controller_kafkacontroller_value{name="ActiveControllerCount"}) != 1
      for: 10s
      labels:
        severity: page
      annotations:
        summary: "Active controller count for env {{ $labels.env }}"
        description: "Active controller count for env {{ $labels.env }} is {{ $value }}."

    # Page when OfflinePartitionsCount > 0
    - alert: OfflinePartitionCount
      expr: sum by(env) (kafka_controller_kafkacontroller_value{name="OfflinePartitionsCount"}) > 0
      for: 10s
      labels:
        severity: page
      annotations:
        summary: "Offline partitions for env {{ $labels.env }}"
        description: "Offline partitions count for env {{ $labels.env }} is {{ $value }}."

    # Page when UncleanLeaderElectionsPerSec > 0 for more than 1m.
    - alert: UncleanLeaderElections
      expr: sum by(env) (kafka_controller_controllerstats_oneminuterate{name="UncleanLeaderElectionsPerSec"}) > 0
      for: 1m
      labels:
        severity: page
      annotations:
        summary: "UncleanLeaderElections for env {{ $labels.env }}"
        description: "UncleanLeaderElections count for env {{ $labels.env }} is {{ $value }}."

    # Page when UnderReplicatedPartitions > 0 for more than 1m.
    - alert: UnderReplicatedPartitions
      expr: sum by(env) (kafka_server_replicamanager_value{name="UnderReplicatedPartitions"}) > 0
      for: 1m
      labels:
        severity: page
      annotations:
        summary: "UnderReplicatedPartitions for env {{ $labels.env }}"
        description: "UnderReplicatedPartitions for env {{ $labels.env }} is {{ $value }}."

    # Page when UnderMinIsrPartitionCount > 0 for more than 1m.
    - alert: UnderMinIsrPartitionCount
      expr: sum by (env) (kafka_server_replicamanager_value{name="UnderMinIsrPartitionCount"}) > 0
      for: 1m
      labels:
        severity: page
      annotations:
        summary: "UnderMinIsrPartitionCount for env {{ $labels.env }}"
        description: "UnderMinIsrPartitionCount for env {{ $labels.env }} is {{ $value }}."

    # Alert when broker count drops below expected (3 brokers)
    - alert: KafkaBrokerCountChanged
      expr: count(up{job="kafka-broker"} == 1) < 3
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Kafka broker count is below expected"
        description: "Expected 3 brokers but only {{ $value }} are up."

    # Alert when a broker is down
    - alert: KafkaBrokerDown
      expr: up{job="kafka-broker"} == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "Kafka broker {{ $labels.instance }} is down"
        description: "Kafka broker {{ $labels.instance }} has been down for more than 30 seconds."

    # Alert on high request latency (99th percentile > 1 second)
    - alert: KafkaHighRequestLatency
      expr: kafka_network_requestmetrics_99thpercentile{name="TotalTimeMs"} > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High Kafka request latency"
        description: "99th percentile request latency is {{ $value }}ms for {{ $labels.request }} requests."

    # Alert when request handler idle is too low (brokers overloaded)
    - alert: KafkaRequestHandlerIdleLow
      expr: kafka_server_kafkarequesthandlerpool_oneminuterate{name="RequestHandlerAvgIdlePercent"} < 0.3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kafka request handlers are overloaded"
        description: "Request handler idle percent is {{ $value | printf \"%.2f\" }}, indicating high broker load."

  - name: kafka-consumers
    rules:
    # Alert when consumer lag is high (> 10000 messages for 5 minutes)
    - alert: KafkaConsumerLagHigh
      expr: kafka_server_fetcherlagmetrics_consumerlag > 10000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High consumer lag detected"
        description: "Consumer lag for {{ $labels.topic }}-{{ $labels.partition }} is {{ $value }} messages."

    # Alert when consumer group lag is consistently growing
    - alert: KafkaConsumerLagGrowing
      expr: delta(kafka_server_fetcherlagmetrics_consumerlag[5m]) > 1000
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Consumer lag is growing"
        description: "Consumer lag for {{ $labels.topic }}-{{ $labels.partition }} has increased by {{ $value }} in the last 5 minutes."

  - name: kafka-connect
    rules:
    # Alert when Connect worker is down
    - alert: KafkaConnectDown
      expr: up{job="kafka-connect"} == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "Kafka Connect worker is down"
        description: "Kafka Connect worker {{ $labels.instance }} has been down for more than 30 seconds."

    # Alert when a connector task fails
    - alert: KafkaConnectTaskFailed
      expr: kafka_connect_connector_task_status{status="failed"} > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Kafka Connect task failed"
        description: "Connector {{ $labels.connector }} task {{ $labels.task }} has failed."

    # Alert when connector is not running
    - alert: KafkaConnectorNotRunning
      expr: kafka_connect_connector_status{status!="running"} > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Kafka connector is not running"
        description: "Connector {{ $labels.connector }} is in {{ $labels.status }} state."

    # Alert when no connectors are deployed (after initial setup)
    - alert: KafkaConnectNoConnectors
      expr: kafka_connect_worker_connector_count == 0
      for: 10m
      labels:
        severity: info
      annotations:
        summary: "No connectors deployed"
        description: "Kafka Connect has no connectors deployed for more than 10 minutes."

  - name: jvm-health
    rules:
    # Alert when JVM heap usage is high
    - alert: JvmHeapUsageHigh
      expr: (jvm_memory_bytes_used{area="heap"} / jvm_memory_bytes_max{area="heap"}) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "JVM heap usage is high"
        description: "JVM heap usage for {{ $labels.kubernetes_pod_name }} is {{ $value | printf \"%.0f\" }}%."

    # Alert on frequent garbage collection
    - alert: JvmGcFrequent
      expr: rate(jvm_gc_collection_seconds_count[5m]) > 0.5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Frequent JVM garbage collection"
        description: "{{ $labels.kubernetes_pod_name }} is experiencing frequent GC ({{ $value | printf \"%.2f\" }} collections/sec)."

  - name: schema-registry
    rules:
    # Alert when Schema Registry is down
    - alert: SchemaRegistryDown
      expr: up{job="schemaregistry"} == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "Schema Registry is down"
        description: "Schema Registry {{ $labels.instance }} has been down for more than 30 seconds."
