apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 1Gi
  podTemplate:
    labels:
      env: local-poc
      service: kafka-controller
      component: kraftcontroller
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # # ad.datadoghq.com/kraftcontroller.check_names: '["openmetrics"]'
      # # ad.datadoghq.com/kraftcontroller.init_configs: '[{}]'
      # # ad.datadoghq.com/kraftcontroller.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[".*"],"timeout":30}]'
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
