apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-ksqldb-server:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 1Gi
  podTemplate:
    labels:
      env: local-poc
      service: ksqldb
      component: ksqldb
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # ad.datadoghq.com/ksqldb.check_names: '["confluent_platform"]'
      # ad.datadoghq.com/ksqldb.init_configs: '[{"is_jmx": true, "collect_default_metrics": true, "service_check_prefix": "confluent", "new_gc_metrics": true, "collect_default_jvm_metrics": true}]'
      # ad.datadoghq.com/ksqldb.instances: '[{"jmx_url":"service:jmx:rmi://%%host%%:7203/jndi/rmi://%%host%%:7203/jmxrmi","name":"ksqldb_instance","tags":["component:ksqldb","env:local-poc","service:ksqldb","team:data-platform"]}]'
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    envVars:
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: _JAVA_OPTIONS
        value: "-Djava.rmi.server.hostname=$(MY_POD_IP)"
  configOverrides:
    jvm:
      # Override CFK's default local-only JMX so the Datadog DaemonSet agent can connect.
      - -Dcom.sun.management.jmxremote.local.only=false
      - -Dcom.sun.management.jmxremote.host=0.0.0.0
    server:
      - ksql.internal.topic.replicas=1
      - ksql.streams.replication.factor=1
      # Advertise localhost URL for Control Center UI access via port-forward
      - ksql.advertised.listener=http://localhost:8088
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
