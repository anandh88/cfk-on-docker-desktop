apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  podTemplate:
    labels:
      env: local-poc
      service: schema-registry
      component: schemaregistry
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # # ad.datadoghq.com/schemaregistry.check_names: '["openmetrics"]'
      # # ad.datadoghq.com/schemaregistry.init_configs: '[{}]'
      # # ad.datadoghq.com/schemaregistry.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[".*"],"timeout":30}]'
    probe:
      liveness:
        initialDelaySeconds: 180
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
      readiness:
        initialDelaySeconds: 180
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
