apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: "0.6.5"
        url:
          # JDBC connector 10.9.2 with MySQL driver 8.3.0 included
          - name: kafka-connect-jdbc
            archivePath: https://raw.githubusercontent.com/aadmassu/kafka-connect-jdbc-10.9.2-mysql8/main/confluentinc-kafka-connect-jdbc-10.9.2-mysql8.zip
            checksum: 1cf7c9bb829778bf80d12cda33e5d14abce5ce5f08ea5fa38b03405a7cf684108d531c1fc918f885efaafcdc06be46eb6254637231e145ea72762a49583b33f8

  podTemplate:
    labels:
      env: local-poc
      service: kafka-connect
      component: connect
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # ad.datadoghq.com/connect.check_names: '["openmetrics"]'
      # ad.datadoghq.com/connect.init_configs: '[{}]'
      # ad.datadoghq.com/connect.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[{"kafka_connect_connect_worker_metrics_connector_(total|running|paused|failed|unassigned|destroyed)_task_count":{"type":"gauge"}},{"kafka_connect_connect_worker_metrics_task_startup_success_percentage":{"type":"gauge"}},{"kafka_connect_connect_metrics_request_rate":{"type":"gauge"}},{"kafka_connect_connect_metrics_outgoing_byte_rate":{"type":"gauge"}},{"kafka_connect_connect_coordinator_metrics_assigned_connectors":{"type":"gauge"}},{"kafka_connect_source_task_metrics_source_record_active_count_avg":{"type":"gauge"}},{"kafka_connect_source_task_metrics_source_record_write_rate":{"type":"gauge"}},{"kafka_connect_sink_task_metrics_put_batch_max_time_ms":{"type":"gauge"}},{"kafka_connect_sink_task_metrics_put_batch_avg_time_ms":{"type":"gauge"}},{"kafka_connect_sink_task_metrics_sink_record_active_count_avg":{"type":"gauge"}},{"kafka_connect_task_error_metrics_deadletterqueue_produce_requests":{"type":"gauge"}},{"kafka_connect_task_error_metrics_total_record_errors":{"type":"gauge"}},{"kafka_connect_task_error_metrics_total_retries":{"type":"gauge"}},{"java_lang_operatingsystem_processcpuload":{"type":"gauge"}},{"java_lang_operatingsystem_totalmemorysize":{"type":"gauge"}},{"java_lang_operatingsystem_freememorysize":{"type":"gauge"}},{"java_lang_operatingsystem_availableprocessors":{"type":"gauge"}},{"java_lang_memory_heapmemoryusage_used":{"type":"gauge"}},{"java_lang_memory_heapmemoryusage_max":{"type":"gauge"}},{"java_lang_memory_nonheapmemoryusage_used":{"type":"gauge"}},{"java_lang_threading_threadcount":{"type":"gauge"}},{"java_lang_g1_old_generation_collectiontime":{"type":"gauge"}},{"java_lang_g1_young_generation_collectiontime":{"type":"gauge"}},{"jvm_gc_collection_seconds_count":{"type":"gauge"}},{"jvm_gc_collection_seconds_sum":{"type":"gauge"}},{"jmx_scrape_duration_seconds":{"type":"gauge"}},{"jmx_scrape_error":{"type":"gauge"}}],"timeout":120,"max_returned_metrics":10000}]'
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi
  configOverrides:
    server:
      - config.storage.replication.factor=1
      - offset.storage.replication.factor=1
      - status.storage.replication.factor=1
      - producer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      - consumer.interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor
  metrics:
    prometheus:
      rules:
        # Worker rebalance metrics
        - pattern: "kafka.connect<type=connect-worker-rebalance-metrics><>([a-zA-Z-]+)"
          name: "kafka_connect_connect_worker_rebalance_metrics_$1"
        # Worker metrics
        - pattern: "kafka.connect<type=connect-worker-metrics><>([a-zA-Z-]+)"
          name: "kafka_connect_connect_worker_metrics_$1"
        # Worker metrics with connector label
        - pattern: "kafka.connect<type=connect-worker-metrics, connector=(.+)><>([a-zA-Z-]+)"
          name: "kafka_connect_connect_worker_metrics_$2"
          labels:
            connector: "$1"
        # Connector metrics (status)
        - pattern: "kafka.connect<type=connector-metrics, connector=(.+)><>([a-zA-Z-]+)"
          name: "kafka_connect_connector_metrics_$2"
          labels:
            connector: "$1"
        # Task metrics (source/sink)
        - pattern: "kafka.connect<type=([a-zA-Z]+)-task-metrics, connector=(.+), task=([0-9]+)><>([a-zA-Z-]+)"
          name: "kafka_connect_$1_task_metrics_$4"
          labels:
            connector: "$2"
            task: "$3"
        # Connector task metrics
        - pattern: "kafka.connect<type=connector-task-metrics, connector=(.+), task=([0-9]+)><>([a-zA-Z-]+)"
          name: "kafka_connect_connector_task_metrics_$3"
          labels:
            connector: "$1"
            task: "$2"
        # Task error metrics
        - pattern: "kafka.connect<type=task-error-metrics, connector=(.+), task=([0-9]+)><>([a-zA-Z-]+)"
          name: "kafka_connect_task_error_metrics_$3"
          labels:
            connector: "$1"
            task: "$2"
        # Connect coordinator metrics
        - pattern: "kafka.connect<type=connect-coordinator-metrics, client-id=(.+)><>([a-zA-Z-]+)"
          name: "kafka_connect_connect_coordinator_metrics_$2"
          labels:
            client_id: "$1"
        # Connect metrics (network)
        - pattern: "kafka.connect<type=connect-metrics, client-id=(.+)><>([a-zA-Z-]+)"
          name: "kafka_connect_connect_metrics_$2"
          labels:
            client_id: "$1"
        # App info
        - pattern: "kafka.connect<type=app-info, client-id=(.+)><>([a-zA-Z-]+): (.+)"
          name: "kafka_connect_app_info"
          value: "1"
          labels:
            client_id: "$1"
            $2: "$3"
        # Catch remaining kafka.connect metrics
        - pattern: "kafka.connect<type=(.+), (.+)=(.+)><>([a-zA-Z-]+)"
          name: "kafka_connect_$1_$4"
          labels:
            "$2": "$3"
        # Catch-all for remaining metrics
        - pattern: ".*"
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
