apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  podTemplate:
    labels:
      env: local-poc
      service: schema-registry
      component: schemaregistry
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # ad.datadoghq.com/schemaregistry.check_names: '["openmetrics"]'
      # ad.datadoghq.com/schemaregistry.init_configs: '[{}]'
      # ad.datadoghq.com/schemaregistry.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[".*"],"timeout":30}]'
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  metrics:
    prometheus:
      rules:
        # Schema Registry application metrics
        - pattern: "kafka.schema.registry<type=(.+), (.+)=(.+)><>(.+):"
          name: kafka_schema_registry_$1_$4
          labels:
            $2: "$3"
        - pattern: "kafka.schema.registry<type=(.+)><>(.+):"
          name: kafka_schema_registry_$1_$2
        # JVM metrics
        - pattern: "java.lang<type=Memory><HeapMemoryUsage>(.+)"
          name: jvm_memory_heap_$1
          type: GAUGE
        - pattern: "java.lang<type=Memory><NonHeapMemoryUsage>(.+)"
          name: jvm_memory_nonheap_$1
          type: GAUGE
        - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionCount"
          name: jvm_gc_collection_count
          labels:
            gc: "$1"
          type: COUNTER
        - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionTime"
          name: jvm_gc_collection_time_ms
          labels:
            gc: "$1"
          type: COUNTER
        - pattern: "java.lang<type=Threading><>ThreadCount"
          name: jvm_threads_current
          type: GAUGE
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
