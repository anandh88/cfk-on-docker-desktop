apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-ksqldb-server:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 1Gi
  podTemplate:
    labels:
      env: local-poc
      service: ksqldb
      component: ksqldb
      team: data-platform
    annotations:
      # Datadog-specific annotations: keep commented unless the Datadog integration is enabled.
      # ad.datadoghq.com/ksqldb.check_names: '["openmetrics"]'
      # ad.datadoghq.com/ksqldb.init_configs: '[{}]'
      # ad.datadoghq.com/ksqldb.instances: '[{"openmetrics_endpoint":"http://%%host%%:7778/metrics","namespace":"cfk","metrics":[".*"],"timeout":30}]'
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  configOverrides:
    server:
      - ksql.internal.topic.replicas=1
      - ksql.streams.replication.factor=1
      # Advertise localhost URL for Control Center UI access via port-forward
      - ksql.advertised.listener=http://localhost:8088
  metrics:
    prometheus:
      rules:
        # ksqlDB application metrics
        - pattern: "io.confluent.ksql.metrics<type=(.+), (.+)=(.+), (.+)=(.+)><>(.+):"
          name: io_confluent_ksql_metrics_$1_$6
          labels:
            $2: "$3"
            $4: "$5"
        - pattern: "io.confluent.ksql.metrics<type=(.+), (.+)=(.+)><>(.+):"
          name: io_confluent_ksql_metrics_$1_$4
          labels:
            $2: "$3"
        - pattern: "io.confluent.ksql.metrics<type=(.+)><>(.+):"
          name: io_confluent_ksql_metrics_$1_$2
        # JVM metrics
        - pattern: "java.lang<type=Memory><HeapMemoryUsage>(.+)"
          name: jvm_memory_heap_$1
          type: GAUGE
        - pattern: "java.lang<type=Memory><NonHeapMemoryUsage>(.+)"
          name: jvm_memory_nonheap_$1
          type: GAUGE
        - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionCount"
          name: jvm_gc_collection_count
          labels:
            gc: "$1"
          type: COUNTER
        - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionTime"
          name: jvm_gc_collection_time_ms
          labels:
            gc: "$1"
          type: COUNTER
        - pattern: "java.lang<type=Threading><>ThreadCount"
          name: jvm_threads_current
          type: GAUGE
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
